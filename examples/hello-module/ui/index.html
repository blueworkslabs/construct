<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Module</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><p class="eyebrow">CONSTRUCT / HELLO</p><h1>A little tool.<br>Your phone.</h1>
<p>Version __VERSION__ · running locally</p><p id="status" role="status">Connecting to Construct…</p>
<output id="count">0</output><button id="add" disabled>Add one</button>
<button id="toast" disabled>Say hello</button><button id="reset" hidden disabled>Reset counter</button>
<p class="hint">Close and reopen: your count stays here. Updates change this tool, not the host app.</p>
</main></body></html>
